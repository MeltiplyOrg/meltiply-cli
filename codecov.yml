coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 75%
        informational: true

ignore:
  - cmd/**
  - internal/cli/*_test.go

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
